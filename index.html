<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR Calculator — D&amp;D 5e Monster Challenge Rating</title>
<meta name="description" content="Calculate a D&amp;D 5e monster's challenge rating from its defensive and offensive statistics.">

<!-- Paths are root-relative so Vite can rewrite them against `base`. The site
     is served from a subpath here and a different subpath on the mirror, so a
     genuinely absolute /favicon.ico would miss on both. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#494949">

<!-- The card a link to this unfurls into. og:image has to be absolute: the
     scraper fetching it has no page to resolve a relative path against. -->
<meta property="og:type" content="website">
<meta property="og:title" content="CR Calculator — D&amp;D 5e Monster Challenge Rating">
<meta property="og:description" content="Calculate a D&amp;D 5e monster's challenge rating from its defensive and offensive statistics.">
<meta property="og:url" content="https://parthjain.ca/cr-calculator/">
<meta property="og:image" content="https://parthjain.ca/cr-calculator/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A wizard's hat beside the words CR Calculator.">
<meta name="twitter:card" content="summary_large_image">

</head>
